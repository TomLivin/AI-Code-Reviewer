# Development dependencies only. The API, Worker and frontend containers are
# added in M10; until then those run from the SDK against this database.
services:
  postgres:
    image: postgres:17-alpine
    container_name: aicodereview-postgres
    environment:
      # Local development credentials. Production configuration is supplied by
      # the platform through ConnectionStrings__AppDb and never lives in a file.
      POSTGRES_USER: aicodereview
      POSTGRES_PASSWORD: aicodereview
      POSTGRES_DB: aicodereview
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Lets dependent services wait for readiness rather than for the port to
      # open, which happens well before PostgreSQL can serve queries.
      test: ["CMD-SHELL", "pg_isready -U aicodereview -d aicodereview"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
